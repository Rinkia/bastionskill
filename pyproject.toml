[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bastionskill"
version = "0.2.0"
description = "Skill-poisoning scanner: detect malicious bundled code (network egress, secret theft, hook-install persistence, destructive commands) in agent skills before you install them — the code-layer that a plain grepper and a prompt-scanner miss."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefano Rizzello", email = "rizzellostefano@gmail.com" }]
keywords = ["skill", "agent-skill", "claude-code", "security", "supply-chain", "prompt-injection", "ai-agent", "skill-poisoning", "agent-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
prompt = ["bastionsupply>=0.4.0"]
dev = ["pytest>=7.0"]

[project.scripts]
bastionskill = "bastionskill.cli:main"

[project.urls]
Homepage = "https://github.com/Rinkia/bastionskill"
Repository = "https://github.com/Rinkia/bastionskill"
Issues = "https://github.com/Rinkia/bastionskill/issues"

[tool.setuptools]
packages = ["bastionskill"]
