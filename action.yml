name: "bastionskill scan"
description: "Scan agent skills for code-layer poisoning (hook-install, egress, secret theft, opaque binaries) and fail the build on risky findings."
branding:
  icon: "shield"
  color: "red"
inputs:
  path:
    description: "Skill dir, or a dir of skills, to scan."
    required: false
    default: "."
  fail-on:
    description: "Exit non-zero at this severity or worse: critical|high|medium|low|none."
    required: false
    default: "high"
  version:
    description: "bastionskill version spec for pip, e.g. '==0.1.0'. Empty = latest."
    required: false
    default: ""
  report:
    description: "Optional path to write a signable JSON scan manifest."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - shell: bash
      run: python -m pip install --quiet "bastionskill${{ inputs.version }}"
    - shell: bash
      run: |
        args=(scan "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}")
        if [ -n "${{ inputs.report }}" ]; then args+=(--report "${{ inputs.report }}"); fi
        bastionskill "${args[@]}"
